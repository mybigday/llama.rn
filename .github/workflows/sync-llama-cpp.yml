name: Sync llama.cpp

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize build space
        run: |
          df -h
          echo "Removing dotnet"
          sudo rm -rf /usr/share/dotnet
          echo "Removing ghc"
          sudo rm -rf /opt/ghc
          echo "Removing hostedtoolcache"
          sudo rm -rf /opt/hostedtoolcache
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: true

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run complete sync
        run: ./scripts/update-llama-cpp.sh
        env:
          IGNORE_PUSH: '1'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Android libraries
        run: npm run build:android-libs

  sync:
    needs: build-android
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history for branch operations
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          lfs: true

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run complete sync
        run: |
          chmod +x scripts/update-llama-cpp.sh scripts/finalize-sync.sh
          ./scripts/update-llama-cpp.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build iOS frameworks
        run: npm run build:ios-frameworks

      - name: Run c++ unit tests
        run: |
          cd tests
          mkdir -p build && cd build
          cmake .. && make && ./rnllama_tests

      - name: Build TypeScript library
        run: npm run build

      - name: Finalize sync
        run: ./scripts/finalize-sync.sh

      - name: Create Pull Request
        if: success()
        run: |
          # llama.cpp pins before/after the sync, from vendor/VERSIONS
          CURRENT_TAG=$(git show HEAD:vendor/VERSIONS | sed -n 's/^LLAMA_CPP_REF=//p')
          PREVIOUS_TAG=$(git show main:vendor/VERSIONS | sed -n 's/^LLAMA_CPP_REF=//p')

          # Upstream clone left behind by scripts/sync-vendor.sh
          LLAMA_CPP_REPO="${LLAMA_RN_CACHE_DIR:-$HOME/.cache/llama.rn}/llama.cpp"

          # Generate llama.cpp changelog if versions differ
          LLAMA_CHANGELOG=""
          if [[ "$CURRENT_TAG" != "$PREVIOUS_TAG" && -d "$LLAMA_CPP_REPO" ]]; then
            echo "📝 Generating llama.cpp changelog from $PREVIOUS_TAG to $CURRENT_TAG..."
            git -C "$LLAMA_CPP_REPO" fetch --quiet --tags origin
            while IFS= read -r line; do
              COMMIT_HASH=$(echo "$line" | cut -d' ' -f1)
              COMMIT_MSG=$(echo "$line" | cut -d' ' -f2-)
              LLAMA_CHANGELOG+="- [\`${COMMIT_HASH:0:7}\`](https://github.com/ggml-org/llama.cpp/commit/$COMMIT_HASH) $COMMIT_MSG"$'\n'
            done < <(git -C "$LLAMA_CPP_REPO" log "${PREVIOUS_TAG}..${CURRENT_TAG}" --oneline --no-merges | head -50)

            if [[ -z "$LLAMA_CHANGELOG" ]]; then
              LLAMA_CHANGELOG="- No commits found between $PREVIOUS_TAG and $CURRENT_TAG"
            fi
          else
            LLAMA_CHANGELOG="- Version unchanged: $CURRENT_TAG"
          fi

          # Prepare PR body with llama.cpp changes
          PR_BODY="🤖 **Automated llama.cpp sync**

          This PR was automatically created/updated by the daily sync workflow.

          **Changes:**
          - Updated the vendored llama.cpp (vendor/llama.cpp) from \`$PREVIOUS_TAG\` to \`$CURRENT_TAG\`
          - Re-applied scripts/patches and regenerated version files

          **Verification:**
          - ✅ Vendor sync and bootstrap completed successfully
          - ✅ iOS frameworks build completed successfully (macOS job)
          - ✅ Android libraries build completed successfully (Ubuntu job)
          - ✅ C++ unit tests passed
          - ✅ TypeScript build completed successfully

          <details>
          <summary>📋 llama.cpp changes ($PREVIOUS_TAG → $CURRENT_TAG)</summary>

          $LLAMA_CHANGELOG
          </details>

          Please review and merge if all checks pass."

          # Check if PR already exists
          EXISTING_PR=$(gh pr list --head auto/sync-llama.cpp --base main --json number --jq '.[0].number' || echo "")

          if [[ -n "$EXISTING_PR" && "$EXISTING_PR" != "null" ]]; then
            echo "✅ PR #$EXISTING_PR already exists, updating it..."
            gh pr edit "$EXISTING_PR" --title "feat: sync llama.cpp to $CURRENT_TAG" --body "$PR_BODY"
          else
            echo "🆕 Creating new PR..."
            gh pr create \
              --head auto/sync-llama.cpp \
              --base main \
              --title "feat: sync llama.cpp to $CURRENT_TAG" \
              --body "$PR_BODY"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Sync failed. Check the workflow logs for details."
          echo "The persistent sync branch was not updated due to build failure."
