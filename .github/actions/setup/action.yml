name: Setup
description: Setup Node.js and install dependencies

inputs:
  bootstrap:
    description: >-
      Steps of scripts/bootstrap.sh the job needs, space separated
      (hexagon-image, hexagon-sdk, example, metal, pods). Bootstrap is skipped
      when empty.
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 20.x

    - name: Cache dependencies
      id: npm-cache
      uses: actions/cache@v4
      continue-on-error: true
      with:
        path: |
          node_modules
          example/node_modules
        # The manifests are named one by one: the key is evaluated again when the
        # job ends, and a `**` glob then walks node_modules and the build output
        # (20-40 s per job).
        key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json', 'example/package-lock.json', 'package.json', 'example/package.json') }}

    - name: Install dependencies
      if: steps.npm-cache.outputs.cache-hit != 'true'
      run: |
        npm ci --prefix example
        npm ci
      shell: bash

    - name: Bootstrap
      if: inputs.bootstrap != ''
      env:
        BOOTSTRAP_STEPS: ${{ inputs.bootstrap }}
      run: ./scripts/bootstrap.sh $BOOTSTRAP_STEPS
      shell: bash

    - name: Build
      run: npm run build
      shell: bash
